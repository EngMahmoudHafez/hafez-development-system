name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Verify tag and package versions
        run: node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"
      - name: Build release artifacts
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          npm sbom --sbom-format cyclonedx > dist/hafez-development-system-${GITHUB_REF_NAME}-sbom.cdx.json
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
