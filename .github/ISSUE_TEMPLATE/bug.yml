name: Bug report
description: Report reproducible Hafez behavior that is unsafe or incorrect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Observed behavior
      description: Redact credentials, provider output, and private repository content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include Hafez version, operating system, Node version, and safe commands.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Incorrect recommendation
        - State or migration failure
        - Delegation or isolation failure
        - Verification false result
        - Installation or packaging failure
        - Other
    validations:
      required: true
