name: Feature request
description: Propose a scoped workflow, adapter, or safety improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real workflow cannot be completed safely today?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and expected outcome
    validations:
      required: true
