name: Feature request
description: Propose a bounded workflow, adapter, or compatibility improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user decision or workflow gap, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Current evidence
      description: Link public documentation or provide a generic reproduction without private data.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
